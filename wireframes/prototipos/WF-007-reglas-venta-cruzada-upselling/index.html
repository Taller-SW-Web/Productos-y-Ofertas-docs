<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WF-007 — Reglas de venta cruzada y upselling</title>
  <style>
    :root{
      --surface:#fff;--neutral-10:#f3f4f6;--neutral-20:#e5e7eb;--neutral-30:#d1d5db;
      --neutral-50:#6b7280;--neutral-70:#374151;--neutral-90:#111827;
      --n10:var(--neutral-10);--n30:var(--neutral-30);--n50:var(--neutral-50);--n90:var(--neutral-90);
      --g:24px;--r:4px;--max:1200px;
    }
    *{box-sizing:border-box}body{margin:0;color:var(--n90);background:#fff;font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}[hidden]{display:none!important}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--n90);outline-offset:2px}
    input[type="checkbox"], input[type="radio"]{accent-color:var(--neutral-90)}
    .topbar{border-bottom:1px solid var(--n30)}.topbar-in{max-width:var(--max);margin:auto;padding:14px var(--g);display:flex;justify-content:space-between;align-items:center;gap:24px}.brand{display:flex;align-items:center;gap:12px;font-weight:700}.mark{width:36px;height:36px;border:2px solid var(--n90);display:grid;place-items:center}.nav{display:flex;gap:20px;color:var(--n50);font-size:14px}.nav [aria-current=page]{color:var(--n90);font-weight:700}main{max-width:var(--max);margin:auto;padding:36px var(--g) 72px}.crumbs{font-size:14px;color:var(--n50);margin-bottom:20px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px}h1{font-size:clamp(24px,4vw,40px);line-height:1.15;letter-spacing:-.025em;margin:0;word-break:break-word}h2{font-size:24px;line-height:1.2;margin:0}h3{font-size:18px;margin:0}.lede{font-size:18px;color:var(--n50);margin:10px 0 0}.muted{color:var(--n50)}.small{font-size:14px}
    .btn{min-height:44px;border:1px solid var(--n90);border-radius:var(--r);background:#fff;color:var(--n90);padding:10px 16px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{background:var(--n10)}.btn-primary,.primary{background:var(--n90);color:#fff}.btn-primary:hover,.primary:hover{background:#000}.link{border-color:transparent;padding-inline:8px}.btn:disabled{color:var(--n50);border-color:var(--n30);background:var(--n10)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .toolbar{border:1px solid var(--n30);padding:16px;display:grid;grid-template-columns:minmax(240px,1fr) 170px 170px;gap:12px;margin-bottom:16px}.field{display:grid;gap:6px}.field label,.label{font-size:13px;font-weight:700}.input,.select,.textarea{width:100%;min-height:44px;border:1px solid var(--n30);border-radius:var(--r);background:#fff;color:var(--n90);padding:9px 12px}.textarea{min-height:86px;resize:vertical}.input[aria-invalid=true],.select[aria-invalid=true],.textarea[aria-invalid=true]{border:2px solid var(--n90)}.hint,.error{font-size:13px}.hint{color:var(--n50)}.error{font-weight:650}.panel{border:1px solid var(--n30);padding:24px;background:#fff}.panel+.panel{margin-top:16px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--n30);width:100%}table{width:100%;min-width:600px;border-collapse:collapse}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--n30);vertical-align:middle}th{background:var(--n10);font-size:12px;text-transform:uppercase;letter-spacing:.05em}tbody tr:last-child td{border-bottom:0}.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700}.dot{width:9px;height:9px;border:1px solid var(--n90);border-radius:50%}.status.on .dot{background:var(--n90)}.tag{display:inline-block;border:1px solid var(--n90);padding:3px 8px;font-size:12px;font-weight:700}.actions{white-space:nowrap}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.span2{grid-column:span 2}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid var(--n30);padding:14px;cursor:pointer}.choice.selected{border:2px solid var(--n90);padding:13px}.origin-box{border:1px solid var(--n30);padding:16px}.recommended{display:grid;gap:12px}.rec-card{border:1px solid var(--n30);padding:16px}.rec-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.order{width:36px;height:36px;border:1px solid var(--n90);display:grid;place-items:center;font-weight:700}.rec-fields{display:grid;grid-template-columns:130px 1fr;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--n30)}.form-actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--n30)}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--n30);border:1px solid var(--n30)}.metric{background:#fff;padding:18px}.metric strong{display:block;font-size:20px}.flow-list{list-style:none;margin:0;padding:0}.flow-item{display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:start;padding:16px 0;border-top:1px solid var(--n30)}.flow-item:first-child{border-top:0}.rank{width:34px;height:34px;border:1px solid var(--n90);display:grid;place-items:center;font-weight:700}.notice{border:1px solid var(--n90);padding:14px 16px;display:flex;gap:12px}.empty{text-align:center;padding:56px 20px;border:1px solid var(--n30)}
    .overlay{position:fixed;inset:0;background:rgba(17,24,39,.55);display:grid;place-items:center;padding:24px;z-index:20}.dialog{width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow-y:auto;background:#fff;border:1px solid var(--n90);padding:24px}.dialog h2{margin-bottom:8px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.toast{position:fixed;right:24px;bottom:24px;max-width:380px;background:#fff;border:1px solid var(--n90);padding:14px 16px;z-index:30}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media (max-width: 900px){.nav{display:none}.page-head{align-items:flex-start;flex-direction:column}.toolbar{grid-template-columns:1fr 1fr}.toolbar .field:first-child{grid-column:span 2}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.metrics{grid-template-columns:1fr 1fr}.panel{padding:18px}.rec-fields{grid-template-columns:1fr}}
    @media (max-width: 600px){:root{--g:16px}.toolbar{grid-template-columns:1fr}.toolbar .field:first-child{grid-column:auto}.page-head .btn{width:100%}.choices,.metrics{grid-template-columns:1fr}.form-actions,.dialog-actions{flex-direction:column-reverse}.form-actions .btn,.dialog-actions .btn{width:100%}.flow-item{grid-template-columns:36px 1fr}.flow-item>.tag{grid-column:2}.toast{left:16px;right:16px}.topbar-in{padding-inline:16px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-in"><div class="brand"><div class="brand-mark" aria-hidden="true">PO</div><span class="brand-text">PO Productos y ofertas</span></div><nav class="nav" aria-label="Navegación principal"><span>Productos</span><span>Promociones</span><span>Cupones</span><span aria-current="page">Reglas</span></nav></div></header>
  <main id="app" tabindex="-1"></main><div id="overlay"></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script>
  (()=>{
    const rules=[
      {name:'Complementos para running',type:'CROSS_SELL',originType:'Producto',origin:'Zapatillas Run Pro',priority:1,state:'ACTIVA',start:'2026-09-01T00:00',end:'2026-12-31T23:59',items:[{name:'Medias deportivas',order:1,stock:42,price:29.9,note:''},{name:'Botella deportiva',order:2,stock:18,price:39.9,note:''}]},
      {name:'Mejora de calzado running',type:'UPSELL',originType:'Categoría',origin:'Zapatillas de running',priority:2,state:'ACTIVA',start:'2026-09-10T00:00',end:'2026-11-30T23:59',items:[{name:'Zapatillas Run Pro Max',order:1,stock:12,price:349.9,note:'Incorpora tecnología de amortiguación adicional.'},{name:'Zapatillas Trail Elite',order:2,stock:7,price:399.9,note:'Suela de mayor resistencia y tracción.'}]},
      {name:'Accesorios de invierno',type:'CROSS_SELL',originType:'Categoría',origin:'Ropa térmica',priority:3,state:'INACTIVA',start:'2026-07-01T00:00',end:'2026-08-31T23:59',items:[{name:'Guantes térmicos',order:1,stock:0,price:49.9,note:''}]}
    ];
    const products=['Medias deportivas','Botella deportiva','Zapatillas Run Pro Max','Zapatillas Trail Elite','Guantes térmicos','Mochila deportiva'];
    const app=document.getElementById('app'),overlay=document.getElementById('overlay'),toastEl=document.getElementById('toast');let timer;
    const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function toast(t){clearTimeout(timer);toastEl.textContent=t;toastEl.hidden=false;timer=setTimeout(()=>toastEl.hidden=true,3000)}
    function head(title,copy,action=''){return `<div class="crumbs">Productos y ofertas / Reglas de recomendación</div><div class="page-head"><div><h1>${title}</h1><p class="lede">${copy}</p></div>${action}</div>`}
    function list(){location.hash='#lista';app.innerHTML=head('Venta cruzada y upselling','Administra complementos y alternativas superiores para los canales de venta.','<div class="row"><button class="btn" data-action="preview">Probar recomendaciones</button><button class="btn primary" data-action="new">Crear regla</button></div>')+`
      <section class="toolbar" aria-label="Filtros"><div class="field"><label for="q">Buscar por nombre u origen</label><input id="q" class="input" placeholder="Ej. running"></div><div class="field"><label for="type">Tipo</label><select id="type" class="select"><option>Todos</option><option>CROSS_SELL</option><option>UPSELL</option></select></div><div class="field"><label for="state">Estado</label><select id="state" class="select"><option>Todos</option><option>Activas</option><option>Inactivas</option></select></div></section>
      <section class="panel" aria-labelledby="rules-title"><div class="panel-head"><div><h2 id="rules-title">Reglas configuradas</h2><p id="count" class="small muted"></p></div></div><div id="rows"></div></section>`;['q','type','state'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',rows));rows()}
    function rows(){const q=document.getElementById('q').value.toLowerCase(),t=document.getElementById('type').value,s=document.getElementById('state').value;const data=rules.filter(r=>(r.name+' '+r.origin).toLowerCase().includes(q)&&(t==='Todos'||r.type===t)&&(s==='Todos'||(s==='Activas'&&r.state==='ACTIVA')||(s==='Inactivas'&&r.state==='INACTIVA')));document.getElementById('count').textContent=`${data.length} resultado${data.length===1?'':'s'} · prioridad 1 es la mayor`;document.getElementById('rows').innerHTML=data.length?`<div class="table-wrap"><table><thead><tr><th>Regla</th><th>Tipo</th><th>Origen</th><th>Prioridad</th><th>Recomendados</th><th>Estado</th><th><span class="sr">Acciones</span></th></tr></thead><tbody>${data.map(r=>{const i=rules.indexOf(r);return `<tr><td><strong>${r.name}</strong></td><td><span class="tag">${r.type==='CROSS_SELL'?'Cross-sell':'Upsell'}</span></td><td><span class="small muted">${r.originType}</span><br>${r.origin}</td><td>${r.priority}</td><td>${r.items.length}</td><td><span class="status ${r.state==='ACTIVA'?'on':''}"><span class="dot"></span>${r.state}</span></td><td class="actions"><button class="btn link" data-action="detail" data-index="${i}">Ver detalle</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty"><h3>No hay reglas que coincidan</h3><p class="muted">Ajusta los filtros de búsqueda.</p></div>'}
    function form(i=null){const r=i===null?{name:'',type:'CROSS_SELL',originType:'Producto',origin:'',priority:1,state:'ACTIVA',start:'',end:'',items:[]}:rules[i];location.hash=i===null?'#nueva':'#editar';app.innerHTML=head(i===null?'Crear regla':'Editar regla','Define cuándo se activa y en qué orden se presentan las recomendaciones.')+`
      <form id="form" class="panel" novalidate><div class="panel-head"><div><h2>Configuración de la regla</h2><p class="small muted">Los campos marcados con * son obligatorios.</p></div></div><div class="form-grid">
        <div class="field span2"><label for="name">Nombre *</label><input id="name" class="input" value="${esc(r.name)}" placeholder="Ej. Complementos para running"><span class="error" id="e-name" hidden></span></div>
        <fieldset class="field span2" style="border:0;padding:0;margin:0"><legend class="label">Tipo de recomendación *</legend><div class="choices"><label class="choice ${r.type==='CROSS_SELL'?'selected':''}"><input type="radio" name="kind" value="CROSS_SELL" ${r.type==='CROSS_SELL'?'checked':''}> Cross-sell <span class="hint" style="display:block">Productos complementarios</span></label><label class="choice ${r.type==='UPSELL'?'selected':''}"><input type="radio" name="kind" value="UPSELL" ${r.type==='UPSELL'?'checked':''}> Upsell <span class="hint" style="display:block">Alternativas superiores justificadas</span></label></div></fieldset>
        <div class="field"><label for="origin-type">Tipo de origen *</label><select id="origin-type" class="select"><option ${r.originType==='Producto'?'selected':''}>Producto</option><option ${r.originType==='Categoría'?'selected':''}>Categoría</option></select></div><div class="field"><label for="origin">Origen que activa la regla *</label><select id="origin" class="select"><option value="">Seleccionar</option><option ${r.origin==='Zapatillas Run Pro'?'selected':''}>Zapatillas Run Pro</option><option ${r.origin==='Zapatillas de running'?'selected':''}>Zapatillas de running</option><option ${r.origin==='Ropa térmica'?'selected':''}>Ropa térmica</option></select><span class="error" id="e-origin" hidden></span></div>
        <div class="field"><label for="priority">Prioridad *</label><input id="priority" class="input" type="number" min="1" step="1" value="${r.priority}"><span class="hint">1 representa la mayor prioridad.</span><span class="error" id="e-priority" hidden></span></div><div class="field"><label for="state-value">Estado *</label><select id="state-value" class="select"><option ${r.state==='ACTIVA'?'selected':''}>ACTIVA</option><option ${r.state==='INACTIVA'?'selected':''}>INACTIVA</option></select></div>
        <div class="field"><label for="start">Inicio *</label><input id="start" class="input" type="datetime-local" value="${r.start}"><span class="error" id="e-start" hidden></span></div><div class="field"><label for="end">Fin *</label><input id="end" class="input" type="datetime-local" value="${r.end}"><span class="error" id="e-end" hidden></span></div>
        <section class="span2" aria-labelledby="recommended-title"><div class="panel-head"><div><h3 id="recommended-title">Productos recomendados *</h3><p class="small muted">El orden se usa dentro de esta regla.</p></div><button type="button" class="btn" data-action="add-product">Agregar producto</button></div><div id="recommended" class="recommended"></div><span class="error" id="e-items" hidden></span></section>
      </div><div class="form-actions"><button type="button" class="btn" data-action="back">Cancelar</button><button class="btn primary" type="submit">Guardar regla</button></div></form>`;
      const items=r.items.length?r.items.map(x=>({...x})):[];app.dataset.items=JSON.stringify(items);renderItems();document.querySelectorAll('[name=kind]').forEach(x=>x.addEventListener('change',kindChange));document.getElementById('form').addEventListener('submit',e=>save(e,i))}
    function kindChange(e){document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x.contains(e.target)));renderItems()}
    function getItems(){try{return JSON.parse(app.dataset.items||'[]')}catch{return[]}}
    function renderItems(){const items=getItems(),up=document.querySelector('[name=kind]:checked')?.value==='UPSELL',box=document.getElementById('recommended');if(!box)return;box.innerHTML=items.length?items.map((x,n)=>`<article class="rec-card"><div class="rec-head"><span class="order">${n+1}</span><div><strong>${esc(x.name)}</strong><span class="small muted" style="display:block">Producto activo</span></div><button type="button" class="btn link" data-action="remove-product" data-index="${n}">Quitar</button></div><div class="rec-fields"><div class="field"><label for="order-${n}">Orden</label><input id="order-${n}" class="input order-input" type="number" min="1" value="${x.order||n+1}" data-index="${n}"></div>${up?`<div class="field"><label for="note-${n}">Justificación comercial *</label><textarea id="note-${n}" class="textarea note-input" data-index="${n}" placeholder="Describe una mejora concreta de su ficha">${esc(x.note||'')}</textarea><span class="error" id="e-note-${n}" hidden></span></div>`:'<div class="hint" style="align-self:end;padding-bottom:10px">Se presentará como producto complementario.</div>'}</div></article>`).join(''):'<div class="empty" style="padding:30px"><h3>Aún no agregaste productos</h3><p class="muted">Añade al menos un producto activo.</p></div>'}
    function chooseProduct(){const used=getItems().map(x=>x.name);const opts=products.filter(x=>!used.includes(x));overlay.innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="pick-title"><h2 id="pick-title">Agregar producto</h2><div class="field" style="margin-top:18px"><label for="pick">Producto activo</label><select id="pick" class="select">${opts.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="dialog-actions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="confirm-product" ${opts.length?'':'disabled'}>Agregar</button></div></section></div>`;overlay.querySelector('button').focus()}
    function addProduct(){const name=document.getElementById('pick').value,items=getItems();items.push({name,order:items.length+1,note:''});app.dataset.items=JSON.stringify(items);overlay.innerHTML='';renderItems()}
    function syncItems(){const items=getItems();document.querySelectorAll('.order-input').forEach(x=>items[x.dataset.index].order=Number(x.value));document.querySelectorAll('.note-input').forEach(x=>items[x.dataset.index].note=x.value);app.dataset.items=JSON.stringify(items);return items}
    function err(input,id,msg){input.setAttribute('aria-invalid','true');const el=document.getElementById(id);el.textContent=msg;el.hidden=false}
    function save(e,i){e.preventDefault();const items=syncItems(),name=document.getElementById('name'),origin=document.getElementById('origin'),priority=document.getElementById('priority'),start=document.getElementById('start'),end=document.getElementById('end'),type=document.querySelector('[name=kind]:checked').value,up=type==='UPSELL';document.querySelectorAll('.error').forEach(x=>x.hidden=true);document.querySelectorAll('[aria-invalid]').forEach(x=>x.removeAttribute('aria-invalid'));let bad=false;if(!name.value.trim()){err(name,'e-name','Ingresa un nombre.');bad=true}if(!origin.value){err(origin,'e-origin','Selecciona un origen.');bad=true}if(!Number.isInteger(Number(priority.value))||Number(priority.value)<1){err(priority,'e-priority','Ingresa un entero mayor o igual a 1.');bad=true}if(!start.value){err(start,'e-start','Indica el inicio.');bad=true}if(!end.value||end.value<=start.value){err(end,'e-end','El fin debe ser posterior al inicio.');bad=true}if(!items.length){const x=document.getElementById('e-items');x.textContent='Agrega al menos un producto recomendado.';x.hidden=false;bad=true}if(items.some(x=>x.name===origin.value)){const x=document.getElementById('e-items');x.textContent='El producto de origen no puede recomendarse a sí mismo.';x.hidden=false;bad=true}if(up)items.forEach((x,n)=>{if(!x.note.trim()){const input=document.getElementById(`note-${n}`);err(input,`e-note-${n}`,`Explica la mejora concreta de ${x.name}.`);bad=true}});if(bad)return;const previous=i===null?null:rules[i],saved={name:name.value.trim(),type,originType:document.getElementById('origin-type').value,origin:origin.value,priority:Number(priority.value),state:document.getElementById('state-value').value,start:start.value,end:end.value,items:items.map((x,n)=>({...x,price:previous?.items[n]?.price??99.9,stock:previous?.items[n]?.stock??10}))};if(i===null)rules.unshift(saved);else rules[i]=saved;toast(i===null?'Regla creada correctamente.':'Cambios guardados.');setTimeout(list,500)}
    function detail(i){const r=rules[i];location.hash='#detalle';app.innerHTML=head(r.name,'Detalle administrativo de la regla.',`<button class="btn" data-action="edit" data-index="${i}">Editar</button>`)+`<section class="panel"><div class="panel-head"><div><h2>Resumen</h2><p class="small muted">Las recomendaciones no agregan ni reemplazan productos automáticamente.</p></div><span class="status ${r.state==='ACTIVA'?'on':''}"><span class="dot"></span>${r.state}</span></div><div class="metrics"><div class="metric"><span class="small muted">Tipo</span><strong>${r.type==='CROSS_SELL'?'Cross-sell':'Upsell'}</strong></div><div class="metric"><span class="small muted">Origen</span><strong class="small">${r.originType}: ${r.origin}</strong></div><div class="metric"><span class="small muted">Prioridad</span><strong>${r.priority}</strong></div><div class="metric"><span class="small muted">Recomendados</span><strong>${r.items.length}</strong></div></div><div style="margin-top:22px"><h3>Orden de presentación</h3><ol class="flow-list">${r.items.sort((a,b)=>a.order-b.order).map(x=>`<li class="flow-item"><span class="rank">${x.order}</span><div><strong>${x.name}</strong><span class="small muted" style="display:block">S/ ${x.price.toFixed(2)} · ${x.stock>0?x.stock+' disponibles':'Sin stock'}</span>${r.type==='UPSELL'?`<p class="small" style="margin:8px 0 0"><strong>Justificación:</strong> ${x.note}</p>`:''}</div><span class="tag">${r.type==='UPSELL'?'Upsell':'Cross-sell'}</span></li>`).join('')}</ol></div><div class="form-actions"><button class="btn" data-action="back">Volver al listado</button><button class="btn" data-action="confirm-state" data-index="${i}">${r.state==='ACTIVA'?'Desactivar':'Activar'} regla</button></div></section>`}
    function preview(){location.hash='#probar';app.innerHTML=head('Probar recomendaciones','Revisa el orden y la disponibilidad que recibiría un canal de venta.')+`<section class="panel"><div class="panel-head"><div><h2>Producto consultado</h2><p class="small muted">Solo se incluyen reglas activas, vigentes y coincidentes.</p></div></div><div class="form-grid"><div class="field span2"><label for="source">Producto</label><select id="source" class="select"><option>Zapatillas Run Pro</option><option>Producto sin coincidencias</option></select></div></div><div class="form-actions"><button class="btn" data-action="back">Volver</button><button class="btn primary" data-action="run-preview">Consultar recomendaciones</button></div></section><div id="preview-result"></div>`}
    function runPreview(){const empty=document.getElementById('source').value.includes('sin');document.getElementById('preview-result').innerHTML=empty?'<section class="empty" style="margin-top:16px"><h2>Sin recomendaciones disponibles</h2><p class="muted">Ninguna regla activa y vigente produjo productos disponibles.</p></section>':`<section class="panel" style="margin-top:16px"><div class="panel-head"><div><h2>Recomendaciones</h2><p class="small muted">Ordenadas por prioridad de regla y luego por orden interno.</p></div><strong>4 resultados</strong></div><ol class="flow-list"><li class="flow-item"><span class="rank">1</span><div><strong>Medias deportivas</strong><span class="small muted" style="display:block">S/ 29.90 · Disponible</span></div><span class="tag">Cross-sell</span></li><li class="flow-item"><span class="rank">2</span><div><strong>Botella deportiva</strong><span class="small muted" style="display:block">S/ 39.90 · Disponible</span></div><span class="tag">Cross-sell</span></li><li class="flow-item"><span class="rank">3</span><div><strong>Zapatillas Run Pro Max</strong><span class="small muted" style="display:block">S/ 349.90 · Disponible</span></div><span class="tag">Upsell</span></li><li class="flow-item"><span class="rank">4</span><div><strong>Zapatillas Trail Elite</strong><span class="small muted" style="display:block">S/ 399.90 · Disponible</span></div><span class="tag">Upsell</span></li></ol></section>`}
    function confirmState(i){const r=rules[i];overlay.innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="d-title"><h2 id="d-title">${r.state==='ACTIVA'?'Desactivar':'Activar'} regla</h2><p>${r.state==='ACTIVA'?'Dejará de participar en nuevas consultas.':'Participará en consultas cuando esté vigente y coincida con el producto.'}</p><div class="dialog-actions"><button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="apply-state" data-index="${i}">Confirmar</button></div></section></div>`;overlay.querySelector('button').focus()}
    document.addEventListener('input',e=>{if(e.target.matches('.order-input,.note-input'))syncItems()});document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,i=Number(b.dataset.index);if(a==='new')form();if(a==='back')list();if(a==='detail')detail(i);if(a==='edit')form(i);if(a==='preview')preview();if(a==='run-preview')runPreview();if(a==='add-product')chooseProduct();if(a==='confirm-product')addProduct();if(a==='remove-product'){const items=syncItems();items.splice(i,1);items.forEach((x,n)=>x.order=n+1);app.dataset.items=JSON.stringify(items);renderItems()}if(a==='close')overlay.innerHTML='';if(a==='confirm-state')confirmState(i);if(a==='apply-state'){rules[i].state=rules[i].state==='ACTIVA'?'INACTIVA':'ACTIVA';overlay.innerHTML='';toast('Estado actualizado.');detail(i)}});list();
  })();
  </script>
</body>
</html>
