<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WF-011 — Gestión de marcas</title>
  <style>
    :root{
      --surface:#fff;
      --neutral-10:#f3f4f6;
      --neutral-20:#e5e7eb;
      --neutral-30:#d1d5db;
      --neutral-50:#6b7280;
      --neutral-70:#374151;
      --neutral-90:#111827;
      --radius:4px;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--neutral-90);
      background:var(--surface);
    }
    *{box-sizing:border-box}
    html{min-width:320px}
    body{margin:0;background:var(--surface);font-size:16px;line-height:1.5}
    button,input,textarea{font:inherit;color:inherit}
    button{min-height:44px;cursor:pointer}
    button:disabled{cursor:not-allowed;color:var(--neutral-50);border-color:var(--neutral-30);background:var(--neutral-10)}
    a,button,input,select,textarea{outline-offset:3px}
    .app-shell{min-height:100vh}
    .topbar{border-bottom:1px solid var(--neutral-30);background:var(--surface)}
    .topbar-inner{max-width:1200px;margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:700}
    .brand-mark{width:32px;height:32px;border:1px solid var(--neutral-90);display:grid;place-items:center;font-family:"Roboto Mono",monospace;font-size:11px}
    .crumb{color:var(--neutral-50);font-size:14px}
    .page{max-width:1200px;margin:auto;padding:32px 24px 64px}
    .page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:32px}
    .page-header h1{font-size:32px;line-height:1.15;margin:0 0 8px;font-weight:700}
    .page-header p{margin:0;color:var(--neutral-50);max-width:760px}
    h2{font-size:24px;line-height:1.2;margin:0 0 16px}
    h3{font-size:18px;line-height:1.3;margin:0 0 12px}
    .mono{font-family:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.02em}
    .ann{display:inline-block;color:var(--neutral-50);border-left:2px solid var(--neutral-30);padding-left:8px;margin-top:10px;font-size:12px}
    .btn{border:1px solid var(--neutral-90);background:var(--surface);padding:10px 14px;border-radius:var(--radius);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
    .btn-primary{background:var(--neutral-90);color:var(--surface)}
    .btn-danger{background:var(--surface);border-style:double;border-width:3px}
    .btn-quiet{border-color:var(--neutral-30);font-weight:500}
    .button-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .button-row.end{justify-content:flex-end}
    .card{border:1px solid var(--neutral-30);background:var(--surface);padding:24px}
    .muted{color:var(--neutral-50)}
    .small{font-size:14px}
    .status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;border:1px solid var(--neutral-30);padding:4px 8px;border-radius:999px;background:var(--surface)}
    .status::before{content:"";width:8px;height:8px;border:1px solid var(--neutral-90);border-radius:50%;background:var(--surface)}
    .status.active::before{background:var(--neutral-90)}
    .status.off::before{background:transparent}
    .notice{border:1px solid var(--neutral-90);padding:16px;display:flex;gap:12px;align-items:flex-start;background:var(--surface);margin-bottom:16px}
    .notice-icon{width:24px;height:24px;min-width:24px;border:1px solid var(--neutral-90);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
    .notice h3{font-size:16px;margin:0 0 4px}
    .notice p{margin:0;color:var(--neutral-70)}
    .notice.error{border-width:2px}
    .toast{position:fixed;right:24px;bottom:24px;border:1px solid var(--neutral-90);background:var(--surface);padding:14px 16px;max-width:360px;z-index:80;display:none}
    .toast.show{display:block}

    .desktop-table,.mobile-brands{width:100%}
    .table-wrap{border:1px solid var(--neutral-30);overflow:hidden}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--neutral-30);vertical-align:middle}
    th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-family:"Roboto Mono",ui-monospace,monospace;font-weight:600;color:var(--neutral-70);background:var(--neutral-10)}
    tbody tr:last-child td{border-bottom:0}
    .row-actions{display:flex;gap:4px;flex-wrap:wrap}
    .row-actions .btn{min-height:36px;padding:6px 9px;font-size:14px}
    .logo-cell{width:48px;height:48px;border:1px solid var(--neutral-90);display:grid;place-items:center;overflow:hidden}
    .logo-cell.empty{color:var(--neutral-50);font-family:"Roboto Mono",monospace;font-size:10px;text-align:center;line-height:1.2;padding:4px}
    .logo-cell img{max-width:100%;max-height:100%}
    .brand-name{font-weight:600}
    .tag{border:1px solid var(--neutral-30);padding:2px 8px;font-size:12px;font-family:"Roboto Mono",monospace;font-weight:600;display:inline-block}
    .tag.strong{border-color:var(--neutral-90)}
    .mobile-brands{display:none}
    .brand-card{border:1px solid var(--neutral-30);padding:16px}
    .brand-card + .brand-card{margin-top:12px}

    .section{border:1px solid var(--neutral-30);padding:24px;margin-bottom:16px}
    .field{margin-bottom:16px}
    .field:last-child{margin-bottom:0}
    label{display:block;font-weight:600;margin-bottom:6px}
    .hint{display:block;font-size:13px;color:var(--neutral-50);margin-top:5px}
    input[type="text"],textarea{width:100%;border:1px solid var(--neutral-30);background:var(--surface);padding:11px 12px;border-radius:var(--radius);min-height:44px}
    textarea{min-height:96px;resize:vertical}
    .field-error{display:block;color:#b45309;background:#fef3c7;border:1px solid #f59e0b;padding:8px 10px;margin-top:8px;font-size:14px}
    .logo-box{border:1px dashed var(--neutral-50);padding:20px;text-align:center;background:var(--neutral-10)}
    .logo-preview{width:64px;height:64px;border:1px solid var(--neutral-90);margin:0 auto 12px;display:grid;place-items:center;overflow:hidden;background:var(--surface)}
    .logo-preview img{max-width:100%;max-height:100%;display:block}

    .detail-head{display:flex;gap:24px;align-items:flex-start;margin-bottom:24px}
    .detail-logo{width:96px;height:96px;border:1px solid var(--neutral-90);display:grid;place-items:center;overflow:hidden;flex-shrink:0}
    .detail-logo.empty{color:var(--neutral-50);font-family:"Roboto Mono",monospace;font-size:11px;text-align:center;line-height:1.3;padding:8px}
    .detail-logo img{max-width:100%;max-height:100%}
    .kv{border-top:1px solid var(--neutral-30);padding:12px 0}
    .kv-label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--neutral-50);margin-bottom:2px}
    .kv-value{font-weight:600}

    .overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:90;display:none;align-items:center;justify-content:center;padding:24px}
    .overlay.open{display:flex}
    .dialog{width:min(680px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--surface);border:1px solid var(--neutral-90);padding:24px}
    .dialog.small-dialog{width:min(520px,100%)}
    .dialog-header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}
    .dialog-header h2{margin:0}
    .icon-button{width:44px;height:44px;border:1px solid var(--neutral-90);background:var(--surface);font-size:20px;line-height:1}
    .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--neutral-30);border-top-color:var(--neutral-90);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px;margin-right:8px}
    @keyframes sp{to{transform:rotate(360deg)}}
    .prog-text{font-family:"Roboto Mono",monospace;font-size:13px;color:var(--neutral-50)}

    .empty-state{border:1px solid var(--neutral-30);padding:48px 24px;text-align:center}
    .empty-state h2{margin-bottom:8px}
    .empty-state p{color:var(--neutral-50);margin:0 auto 20px;max-width:520px}

    .skeleton{border:1px solid var(--neutral-30);padding:16px}
    .sk-line{height:14px;background:var(--neutral-10);margin:8px 0}
    .sk-line.w30{width:30%}.sk-line.w50{width:50%}.sk-line.w80{width:80%}

    @media (max-width:900px){
      .desktop-table{display:none}
      .mobile-brands{display:block}
      .page-header{align-items:stretch}
    }
    @media (max-width:600px){
      .topbar-inner{padding:12px 16px}
      .crumb{display:none}
      .page{padding:24px 16px 48px}
      .page-header{display:block;margin-bottom:24px}
      .page-header h1{font-size:28px}
      .page-header .button-row{margin-top:16px}
      .page-header .btn{width:100%}
      .section,.card{padding:16px}
      .row-actions,.button-row{display:grid;grid-template-columns:1fr;width:100%}
      .row-actions .btn,.button-row .btn{width:100%;min-height:44px}
      .overlay{padding:12px;align-items:flex-end}
      .dialog{max-height:92vh;padding:16px}
      .detail-head{flex-direction:column}
      .detail-logo{width:72px;height:72px}
      .toast{left:16px;right:16px;bottom:16px}
    }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">PO</span><span>Productos y ofertas</span></div>
      <div class="crumb">Productos / Marcas</div>
    </div>
  </header>
  <main id="app" class="page" tabindex="-1"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="deactivateOverlay" class="overlay" aria-hidden="true">
  <section class="dialog small-dialog" role="dialog" aria-modal="true" aria-labelledby="deactivateTitle">
    <div class="dialog-header">
      <div><h2 id="deactivateTitle">Desactivar marca</h2><p id="deactivateMeta" class="muted small"></p></div>
      <button class="icon-button" type="button" id="deactivateCloseTop" aria-label="Cerrar">×</button>
    </div>
    <div id="deactivateBody"></div>
  </section>
</div>

<script>
(() => {
  'use strict';

  /*
    Estados documentales de WF-011 que pueden inspeccionarse sin contaminar la UI:
      ?state=empty            -> listado vacío (S-01-E)
      ?state=list-error       -> error de carga (S-01-E)
      ?state=no-permission    -> usuario sin permiso
      ?state=session-expired  -> sesión expirada
    No se muestran controles de prototipo para cambiar de estado o tamaño de pantalla.
  */

  const MAX_LOGO = 5 * 1024 * 1024;
  const SIMULATED_TIMEOUT_SEC = 4;

  let brands = [
    {id:'nb-nike', name:'Nike', desc:'Calzado e indumentaria deportiva.', country:'Estados Unidos', logo:null, active:true, products:0, validate:'ok'},
    {id:'nb-adidas', name:'Adidas', desc:'', country:'Alemania', logo:null, active:true, products:0, validate:'ok'},
    {id:'nb-sportway', name:'Sportway', desc:'Marca deportiva regional.', country:'Perú', logo:null, active:true, products:4, validate:'blocked'},
    {id:'nb-vulcano', name:'Vulcano', desc:'', country:'Italia', logo:null, active:true, products:0, validate:'ok'},
    {id:'nb-timer', name:'Everest', desc:'Línea de montaña.', country:'Chile', logo:null, active:false, products:0, validate:'timeout'}
  ];

  const state = {
    view:'list',
    editingId:null,
    selectedId:null,
    loading:true,
    saving:false,
    queryState:new URLSearchParams(location.search).get('state') || ''
  };

  const app = document.getElementById('app');
  const toast = document.getElementById('toast');
  const deactivateOverlay = document.getElementById('deactivateOverlay');
  const deactivateMeta = document.getElementById('deactivateMeta');
  const deactivateBody = document.getElementById('deactivateBody');
  const deactivateCloseTop = document.getElementById('deactivateCloseTop');
  let deactivateTarget = null;
  let deactivateMode = 'deactivate';
  let toastTimer = null;

  function escapeHtml(v){ return String(v ?? '').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[ch])); }
  function brandById(id){ return brands.find(b=>b.id===id); }
  function showToast(message){ clearTimeout(toastTimer); toast.textContent=message; toast.classList.add('show'); toastTimer=setTimeout(()=>toast.classList.remove('show'),2800); }
  function statusBadge(b){ return b.active?'<span class="status active">Activo</span>':'<span class="status off">Inactivo</span>'; }

  function logoMarkup(b, size){
    const cls=size==='lg'?'detail-logo':'logo-cell';
    if(b.logo){ return `<span class="${cls}"><img alt="Logo de ${escapeHtml(b.name)}" src="${escapeHtml(b.logo)}"></span>`; }
    return `<span class="${cls} empty">${escapeHtml(b.name.slice(0,1)).toUpperCase()}</span>`;
  }

  function renderGlobalState(){
    if(state.queryState==='no-permission'){
      app.innerHTML=`<div class="page-header"><div><h1>Gestión de marcas</h1><p>Administra las marcas del catálogo.</p></div></div><div class="notice error"><span class="notice-icon" aria-hidden="true">!</span><div><h3>No tienes permiso para administrar marcas.</h3><p>Vuelve al módulo de productos o solicita acceso por el canal definido por tu organización.</p></div></div><button class="btn" data-action="safe-back">Volver a productos</button>`;
      return true;
    }
    if(state.queryState==='session-expired'){
      app.innerHTML=`<div class="page-header"><div><h1>Gestión de marcas</h1><p>Administra las marcas del catálogo.</p></div></div><div class="notice error"><span class="notice-icon" aria-hidden="true">!</span><div><h3>Tu sesión expiró.</h3><p>Inicia sesión nuevamente para continuar.</p></div></div><button class="btn btn-primary" data-action="login">Iniciar sesión</button>`;
      return true;
    }
    return false;
  }

  function renderList(){
    if(state.loading){
      app.innerHTML=`<div class="page-header"><div><h1>Gestión de marcas</h1><p>Consulta, crea, edita, desactiva o reactiva marcas. Solo las marcas activas aparecen en los filtros de los canales.</p></div></div><div class="skeleton"><div class="sk-line w30"></div><div class="sk-line w80"></div><div class="sk-line w50"></div></div>`;
      setTimeout(()=>{state.loading=false;render();},450);
      return;
    }
    if(brands.length===0){
      app.innerHTML=`<div class="page-header"><div><h1>Gestión de marcas</h1><p>Consulta, crea, edita, desactiva o reactiva marcas. Solo las marcas activas aparecen en los filtros de los canales.</p></div></div><div class="empty-state"><h2>Aún no hay marcas.</h2><p>Crea la primera marca para empezar a clasificar tu catálogo.</p><button class="btn btn-primary" data-action="create">Crear primera marca</button></div>`;
      bindPage(); return;
    }
    const rows=brands.map(b=>`
      <tr>
        <td>${logoMarkup(b)}</td>
        <td class="brand-name">${escapeHtml(b.name)}</td>
        <td>${b.country?escapeHtml(b.country):'<span class="muted">—</span>'}</td>
        <td>${b.active?String(b.products):'<span class="muted">—</span>'}</td>
        <td>${statusBadge(b)}</td>
        <td><div class="row-actions">
          <button class="btn btn-quiet" data-action="view" data-id="${b.id}">Ver</button>
          <button class="btn btn-quiet" data-action="edit" data-id="${b.id}">Editar</button>
          ${b.active?`<button class="btn btn-quiet" data-action="deactivate" data-id="${b.id}">Desactivar</button>`:`<button class="btn btn-quiet" data-action="reactivate" data-id="${b.id}">Reactivar</button>`}
        </div></td>
      </tr>`).join('');
    const cards=brands.map(b=>`
      <article class="brand-card">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
          <div style="display:flex;gap:12px;align-items:center">
            ${logoMarkup(b)}
            <div><div class="brand-name">${escapeHtml(b.name)}</div><div class="small muted">${b.country?escapeHtml(b.country):'Sin país'}</div></div>
          </div>
          ${statusBadge(b)}
        </div>
        <div class="small" style="margin:10px 0">${b.active?`Productos activos: ${b.products}`:'Inactiva'}</div>
        <div class="row-actions">
          <button class="btn btn-quiet" data-action="view" data-id="${b.id}">Ver</button>
          <button class="btn btn-quiet" data-action="edit" data-id="${b.id}">Editar</button>
          ${b.active?`<button class="btn btn-quiet" data-action="deactivate" data-id="${b.id}">Desactivar</button>`:`<button class="btn btn-quiet" data-action="reactivate" data-id="${b.id}">Reactivar</button>`}
        </div>
      </article>`).join('');
    app.innerHTML=`<div class="page-header">
        <div><h1>Gestión de marcas</h1><p>Consulta, crea, edita, desactiva o reactiva marcas. Solo las marcas activas aparecen en los filtros de los canales.</p></div>
        <div class="button-row"><button class="btn btn-primary" data-action="create">Crear marca</button></div>
      </div>
      <div class="desktop-table table-wrap"><table>
        <thead><tr><th>Logo</th><th>Nombre</th><th>País</th><th>Productos activos</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="mobile-brands">${cards}</div>
      <p class="ann">A-04 · Las acciones no incluyen eliminación física · A-06 · Solo las marcas activas llegan a los filtros de los canales</p>`;
    bindPage();
  }

  function renderDetail(){
    const b=brandById(state.selectedId);
    if(!b){ showToast('La marca no existe.'); state.selectedId=null; state.view='list'; render(); return; }
    const action=b.active
      ?`<button class="btn btn-danger" data-action="deactivate" data-id="${b.id}">Desactivar</button>`
      :`<button class="btn btn-primary" data-action="reactivate" data-id="${b.id}">Reactivar</button>`;
    app.innerHTML=`<div class="page-header">${backBtn('list')}<div style="flex:1"></div></div>
      <div class="detail-head">
        ${logoMarkup(b,'lg')}
        <div>
          <h1 style="margin:0 0 8px">${escapeHtml(b.name)}</h1>
          ${statusBadge(b)}
        </div>
      </div>
      <div class="section" style="margin-top:0">
        <dl>
          <div class="kv"><dt class="kv-label">Descripción</dt><dd class="kv-value" style="margin:0">${b.desc?escapeHtml(b.desc):'<span class="muted">Sin descripción</span>'}</dd></div>
          <div class="kv"><dt class="kv-label">País de origen</dt><dd class="kv-value" style="margin:0">${b.country?escapeHtml(b.country):'<span class="muted">Sin país</span>'}</dd></div>
          <div class="kv"><dt class="kv-label">Productos activos</dt><dd class="kv-value" style="margin:0">${b.active?String(b.products):'<span class="muted">—</span>'}</dd></div>
        </dl>
        <p class="ann">A-21 · El detalle muestra el efecto en canales · A-22 · Reactivar no exige validación adicional</p>
      </div>
      <div class="button-row">
        <button class="btn" data-action="list">Volver a marcas</button>
        <button class="btn" data-action="edit" data-id="${b.id}">Editar marca</button>
        ${action}
      </div>`;
    bindPage();
  }

  function backBtn(to){
    const label=to==='list'?'Volver a marcas':'Volver';
    return `<button class="btn" data-action="${to}">${label}</button>`;
  }

  function renderForm(){
    const b=state.view==='edit'?brandById(state.editingId):null;
    if(state.view==='edit'&&!b){ showToast('La marca no existe.'); state.view='list'; state.editingId=null; render(); return; }
    const isNew=!b;
    const fname=state.form?.name??(b?b.name:'');
    const fdesc=state.form?.desc??(b?b.desc:'');
    const fcountry=state.form?.country??(b?b.country:'');
    const hasLogo=state.form?.hasLogo??(b?!!b.logo:false);
    const heading=isNew?'Crear marca':'Editar marca';
    const idAttr=`id="${isNew?'createForm':'editForm'}"`;
    app.innerHTML=`<div class="page-header">${backBtn('list')}<div style="flex:1"></div></div>
      <h1>${heading}</h1>
      <form ${idAttr} class="section" style="margin-top:0" novalidate>
        <div class="field">
          <label for="brandName">Nombre *</label>
          <input type="text" id="brandName" value="${escapeHtml(fname)}" required>
          <span class="hint">Debe ser único entre las marcas activas, ignorando mayúsculas y minúsculas.</span>
          <span id="nameError" class="field-error" style="display:none"></span>
          <span id="nameOk" class="hint" style="color:#15803d;display:none">El nombre está disponible.</span>
        </div>
        <div class="field">
          <label for="brandDesc">Descripción</label>
          <textarea id="brandDesc">${escapeHtml(fdesc)}</textarea>
          <span class="hint">Opcional.</span>
        </div>
        <div class="field">
          <label for="brandLogo">Logo</label>
          <div class="logo-box">
            <div class="logo-preview" id="logoPreview">${hasLogo?'<span class="muted mono">Logo previo</span>':'<span class="muted mono">Sin logo</span>'}</div>
            <input type="file" id="brandLogo" accept="image/*">
            <span class="hint">Opcional. Máximo 5 MB. El archivo lo almacena un servicio externo; aquí solo se gestiona la URL resultante.</span>
            <span id="logoError" class="field-error" style="display:none"></span>
          </div>
        </div>
        <div class="field">
          <label for="brandCountry">País de origen</label>
          <input type="text" id="brandCountry" value="${escapeHtml(fcountry)}">
          <span class="hint">Opcional.</span>
        </div>
        <p class="ann">${isNew
          ?'A-09 · Unicidad ignorando mayúsculas/minúsculas · A-10 · Logo máximo 5 MB con rechazo y motivo · A-12 · La marca se registra Activa'
          :'A-13 · El reemplazo de logo valida el tamaño · A-14 · Al guardar se actualiza updated_at · A-15 · Cambiar datos no afecta productos asociados'}</p>
        <div class="button-row end">
          <button class="btn" type="button" data-action="list">Cancelar</button>
          <button class="btn btn-primary" type="submit" id="saveBrandBtn">${isNew?'Crear marca':'Guardar cambios'}</button>
        </div>
      </form>`;
    bindPage();
    bindForm(isNew, b);
  }

  function bindForm(isNew, b){
    const form=app.querySelector('#'+(isNew?'createForm':'editForm'));
    const nameEl=document.getElementById('brandName');
    const nameError=document.getElementById('nameError');
    const nameOk=document.getElementById('nameOk');
    const logoEl=document.getElementById('brandLogo');
    const logoError=document.getElementById('logoError');
    let lastChecked='';

    function checkDuplicate(){
      const v=nameEl.value.trim();
      if(!v){ nameError.style.display='none'; nameOk.style.display='none'; return; }
      const selfIds=isNew?[]:[b.id];
      const dup=brands.some(x=>!selfIds.includes(x.id)&&x.active&&x.name.toLowerCase()===v.toLowerCase());
      if(dup){
        nameError.textContent='Ya existe una marca activa con ese nombre.';
        nameError.style.display='block';
        nameOk.style.display='none';
        return true;
      }
      nameError.style.display='none';
      nameOk.style.display='block';
      return false;
    }
    nameEl.addEventListener('input',()=>{ nameOk.style.display='none'; nameError.style.display='none'; window.clearTimeout(lastChecked); lastChecked=setTimeout(checkDuplicate,350); });
    logoEl.addEventListener('change',()=>{
      const f=logoEl.files&&logoEl.files[0];
      if(!f){ logoError.style.display='none'; return; }
      if(f.size>MAX_LOGO){
        const mb=(f.size/(1024*1024)).toFixed(1);
        logoError.textContent=`El logo no debe superar los 5 MB. (${mb} MB)`;
        logoError.style.display='block';
        logoEl.value='';
        return;
      }
      logoError.style.display='none';
      const reader=new FileReader();
      reader.onload=()=>{ state.form.hasLogo=true; state.form.logoDataUrl=String(reader.result); document.getElementById('logoPreview').innerHTML=`<img src="${state.form.logoDataUrl}" alt="Previsualización del logo">`; };
      reader.readAsDataURL(f);
    });
    form.addEventListener('submit',(e)=>{
      e.preventDefault();
      const v=nameEl.value.trim();
      if(!v){ nameError.textContent='Ingresa un nombre para la marca.'; nameError.style.display='block'; nameEl.focus(); return; }
      const dup=checkDuplicate();
      if(dup){ nameError.textContent='Ya existe una marca activa con ese nombre.'; nameError.style.display='block'; nameEl.focus(); return; }
      state.saving=true;
      document.getElementById('saveBrandBtn').disabled=true;
      showToast('Guardando…');
      setTimeout(()=>{
        state.saving=false;
        state.form.name=v;
        state.form.desc=document.getElementById('brandDesc').value.trim();
        state.form.country=document.getElementById('brandCountry').value.trim();
        if(isNew){
          brands.push({id:'nb-'+Date.now(), name:v, desc:state.form.desc, country:state.form.country, logo:state.form.logoDataUrl||null, active:true, products:0, validate:'ok'});
          showToast('Marca creada.');
        }else{
          b.name=v; b.desc=state.form.desc; b.country=state.form.country;
          if(state.form.logoDataUrl) b.logo=state.form.logoDataUrl;
          showToast('Cambios guardados.');
        }
        state.form=null; state.view='list'; state.editingId=null; state.selectedId=null;
        render();
      },600);
    });
  }

  function openDeactivate(b, mode){
    deactivateTarget=b; deactivateMode=mode||'deactivate';
    if(deactivateMode==='reactivate'){
      document.getElementById('deactivateTitle').textContent='Reactivar marca';
      deactivateMeta.textContent=`${b.name} · Pasará a estado Activo`;
      deactivateBody.innerHTML=`
        <div class="notice">
          <span class="notice-icon" aria-hidden="true">i</span>
          <div><h3>Vuelve a los filtros de los canales.</h3><p>La marca volverá a estar disponible para nuevos productos y para los filtros de venta.</p></div>
        </div>
        <div class="button-row end">
          <button class="btn" type="button" data-deact-cancel>Cancelar</button>
          <button class="btn btn-primary" type="button" id="doDeactivate">Reactivar</button>
        </div>`;
      deactivateOverlay.classList.add('open'); deactivateOverlay.setAttribute('aria-hidden','false');
      document.getElementById('doDeactivate').addEventListener('click',()=>{
        b.active=true; closeDeactivate(); render(); showToast('Marca reactivada.');
      });
      deactivateOverlay.querySelector('[data-deact-cancel]').addEventListener('click',closeDeactivate);
      return;
    }
    document.getElementById('deactivateTitle').textContent='Desactivar marca';
    deactivateMeta.textContent=`${b.name} · Estado actual: Activo`;
    deactivateBody.innerHTML=`
      <div class="notice">
        <span class="notice-icon" aria-hidden="true">!</span>
        <div><h3>La marca dejará de mostrarse en los filtros de los canales.</h3><p>Antes de desactivar validaremos de forma síncrona que no tenga productos activos asociados.</p></div>
      </div>
      <p class="ann">A-16 · Retiro de los filtros de canales · A-17 · Validación síncrona con Catálogo Core, timeout 15 s · A-18 · No existe acción de eliminación física</p>
      <div class="button-row end">
        <button class="btn" type="button" data-deact-cancel>Cancelar</button>
        <button class="btn btn-danger" type="button" id="doDeactivate">Desactivar</button>
      </div>`;
    deactivateOverlay.classList.add('open'); deactivateOverlay.setAttribute('aria-hidden','false');
    const cancel=deactivateOverlay.querySelector('[data-deact-cancel]');
    cancel.addEventListener('click',closeDeactivate);
    document.getElementById('doDeactivate').addEventListener('click',runValidation);
  }

  function runValidation(){
    const b=deactivateTarget;
    if(!b){ return; }
    const seconds=deactivateMode==='deactivate'?SIMULATED_TIMEOUT_SEC:0;
    deactivateBody.innerHTML=`
      <div class="notice" style="margin-bottom:12px">
        <span class="spin" aria-hidden="true"></span>
        <div><h3>Validando productos activos…</h3><p>Consultamos Catálogo Core para confirmar que la marca no tenga productos activos.</p></div>
      </div>
      <p class="prog-text" id="progText">0 s / ${SIMULATED_TIMEOUT_SEC} s · timeout simulado (en producción: 15 s)</p>`;
    const prog=document.getElementById('progText');
    let t=0;
    prog.textContent=`${t} s / ${SIMULATED_TIMEOUT_SEC} s · timeout simulado (en producción: 15 s)`;
    const timer=setInterval(()=>{
      t+=1;
      prog.textContent=`${t} s / ${SIMULATED_TIMEOUT_SEC} s · timeout simulado (en producción: 15 s)`;
      if(t>=SIMULATED_TIMEOUT_SEC){
        clearInterval(timer);
        if(b.validate==='timeout'){ showTimeoutResult(); }
        else if(b.validate==='blocked'){ showBlockedResult(); }
        else {
          b.active=false;
          closeDeactivate(); render(); showToast('Marca desactivada.');
        }
      }
    },1000);
  }

  function showBlockedResult(){
    const b=deactivateTarget;
    deactivateBody.innerHTML=`
      <div class="notice error">
        <span class="notice-icon" aria-hidden="true">!</span>
        <div><h3>No se puede desactivar la marca.</h3><p>Tiene <strong>${b.products} productos activos</strong> asociados. Desactiva o reasigna esos productos antes de reintentar.</p></div>
      </div>
      <p class="ann">A-19 · El bloqueo evita productos sin marca válida en los canales</p>
      <div class="button-row end"><button class="btn" type="button" data-deact-cancel>Cerrar</button></div>`;
    const cancel=deactivateOverlay.querySelector('[data-deact-cancel]');
    cancel.addEventListener('click',closeDeactivate);
  }

  function showTimeoutResult(){
    deactivateBody.innerHTML=`
      <div class="notice error">
        <span class="notice-icon" aria-hidden="true">!</span>
        <div><h3>No pudimos validar los productos asociados.</h3><p>Catálogo Core no respondió dentro del tiempo límite (15 s). No asumimos que la marca esté libre de productos, por lo que la desactivación no se completó.</p></div>
      </div>
      <p class="ann">A-20 · Sin respuesta en 15 s: se rechaza la baja, sin asumir “sin productos”</p>
      <div class="button-row end">
        <button class="btn" type="button" data-deact-cancel>Cerrar</button>
        <button class="btn btn-danger" type="button" id="doDeactivate">Reintentar</button>
      </div>`;
    const cancel=deactivateOverlay.querySelector('[data-deact-cancel]');
    cancel.addEventListener('click',closeDeactivate);
    document.getElementById('doDeactivate').addEventListener('click',runValidation);
  }

  function closeDeactivate(){ deactivateOverlay.classList.remove('open'); deactivateOverlay.setAttribute('aria-hidden','true'); deactivateTarget=null; }

  function bindPage(){
    app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',e=>{
      const action=e.currentTarget.dataset.action, id=e.currentTarget.dataset.id;
      if(action==='list'){ state.view='list'; state.editingId=null; state.selectedId=null; state.form=null; render(); }
      else if(action==='create'){ state.view='create'; state.editingId=null; state.form={name:'',desc:'',country:'',hasLogo:false,logoDataUrl:null}; render(); }
      else if(action==='edit'){ const b=brandById(id); state.view='edit'; state.editingId=id; if(b) state.form={name:b.name,desc:b.desc,country:b.country,hasLogo:!!b.logo,logoDataUrl:(b.logo&&String(b.logo).startsWith('data:'))?b.logo:null}; render(); }
      else if(action==='view'){ state.view='detail'; state.selectedId=id; render(); }
      else if(action==='deactivate'){ openDeactivate(brandById(id),'deactivate'); }
      else if(action==='reactivate'){ openDeactivate(brandById(id),'reactivate'); }
      else if(action==='safe-back'){ showToast('Regreso simulado al módulo de productos.'); }
      else if(action==='login'){ state.queryState=''; state.loading=true; render(); showToast('Sesión recuperada para el prototipo.'); }
    }));
  }

  deactivateCloseTop.addEventListener('click',closeDeactivate);
  deactivateOverlay.addEventListener('click',e=>{ if(e.target===deactivateOverlay) closeDeactivate(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&deactivateOverlay.classList.contains('open')) closeDeactivate(); });

  function render(){
    if(renderGlobalState()){ bindPage(); return; }
    if(state.view==='detail'){ renderDetail(); return; }
    if(state.view==='create'||state.view==='edit'){ renderForm(); return; }
    renderList();
  }

  render();
})();
</script>
</body>
</html>
